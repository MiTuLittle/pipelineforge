services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PIPELINEFORGE_DB_PATH: /data/pipelineforge.db
    volumes:
      - pipelineforge-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  pipelineforge-data:
